<!-- Sets the dark-mode class on <html> before any CSS is even requested,
     so a returning user who chose dark mode never sees a flash of the
     light theme while the page loads. Falls back to the OS/browser's
     color-scheme preference if the person hasn't chosen explicitly yet. -->
<script>(function(){try{
  var t = localStorage.getItem('lwf_theme');
  var wantsDark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(wantsDark) document.documentElement.classList.add('dark-mode');
}catch(e){}})();</script>
